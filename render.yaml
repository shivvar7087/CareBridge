services:
  - type: web
    name: carebridge-ai-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: carebridge-ai-db
          property: connectionString
      - key: DEMO_MODE
        value: "false"
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: carebridge-ai-db
    plan: starter
