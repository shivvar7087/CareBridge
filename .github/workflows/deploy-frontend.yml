name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci || npm install
        working-directory: frontend

      - name: Prepare and Validate API URL
        id: prepare_api
        run: |
          RAW_URL="${VITE_API_URL:-https://carebridge-1-9b9i.onrender.com/api}"
          # Remove trailing slashes
          CLEAN_URL=$(echo "$RAW_URL" | sed 's:/*$::')
          # If does not end with /api, append /api
          if [[ "$CLEAN_URL" != */api ]]; then
            CLEAN_URL="${CLEAN_URL}/api"
          fi
          echo "Validated API URL: $CLEAN_URL"
          echo "api_url=$CLEAN_URL" >> $GITHUB_OUTPUT
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL }}

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_API_URL: ${{ steps.prepare_api.outputs.api_url }}

      - name: Add SPA fallback
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
